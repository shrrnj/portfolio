<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - Sahra Ranjbar</title>
  <link rel="stylesheet" href="../style.css?v=2025-10-21-1">
</head>
<body>
  <main class="container">
    <!-- Heading with dynamic count -->
    <h1><span class="projects-title"></span> Projects</h1>
  
    <!-- Layout wraps the pie + cards -->
    <div class="projects-layout">
  
      <!-- Pie chart container -->
      <svg id="projects-plot"
           viewBox="-60 -60 120 120"
           role="img"
           aria-labelledby="projectsPieTitle">
        <title id="projectsPieTitle">Projects pie (Lab 5 sandbox)</title>
      </svg>
  
      <!-- Projects list -->
      <section class="projects-list" aria-live="polite">
        <!-- Articles will be inserted dynamically by JS -->
      </section>
    </div>
  </main>
  
  <script src="../global.js" type="module"></script>
  <script src="projects.js" type="module"></script>
</body>
</html>
