<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects • Sahra Ranjbar</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <!-- Shared nav will be injected here by global.js -->
  <header class="container" aria-label="Main"></header>

  <main class="container">
    <h1><span class="projects-title">0</span> Projects</h1>

    <div class="projects-layout">
      <!-- Left column: chart + legend + search -->
      <div>
        <!-- Pie chart -->
        <svg id="projects-plot" viewBox="-60 -60 120 120" width="320" height="320"
          role="img" aria-label="Projects per year pie chart"></svg>

        <!-- Legend (Step 5) -->
        <ul class="legend" aria-label="Project years legend"></ul>

        <!-- Search (Step 4) -->
        <input
          class="searchBar"
          type="search"
          placeholder="🔎 Search projects…"
          aria-label="Search projects"
        />
      </div>

      <!-- Right column: project cards -->
      <div class="projects-list" aria-live="polite"></div>
    </div>
  </main>

  <script type="module" src="./projects.js"></script>
  <script src="../global.js"></script>
</body>
</html>
