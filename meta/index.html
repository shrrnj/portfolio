<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="meta-page">
    <main>
      <h1>Meta</h1>

      <p class="meta-description">
        This page includes stats about the code of this website.
      </p>

      <label class="meta-slider">
        <span>Show commits until:</span>
        <input
          type="range"
          id="commit-progress"
          min="0"
          max="100"
          value="100"
        />
        <time id="commit-time"></time>
      </label>

      <div id="stats"></div>

      <section>
        <h2>Commits by time of day</h2>
        <div id="chart"></div>
      </section>

      <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
          <a
            id="commit-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        </dd>
        <dt>Date</dt>
        <dd id="commit-date"></dd>
      </dl>

      <section>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
